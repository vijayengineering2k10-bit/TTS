[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "audiogen-ai"
version = "0.1.0"
description = "A secure, local-first text-to-speech application."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "pypdf>=5.0.0,<7.0.0",
    "streamlit>=1.40.0,<2.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
]

[project.optional-dependencies]
azure = [
    "httpx>=0.27.0,<1.0.0",
]
edge = [
    "edge-tts>=7.0.0,<8.0.0",
]
dev = [
    "httpx>=0.27.0,<1.0.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
